[project]
name = "glem"
version = "0.1.0"
description = "GLEM: Learning on Large-scale Text-attributed Graphs via Variational Inference"
readme = "README.md"
requires-python = "==3.8.*"

# Mirrors the `ct` conda environment (environment.yml + /home/roymahlab/miniconda3/envs/ct).
