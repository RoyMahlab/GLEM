# ruamel-yaml-conda, mkl-fft/mkl-random/mkl-service, brotlipy) are intentionally
# omitted -- they exist only because the env was cloned from a conda base env and
# have no PyPI equivalent that makes sense here. The `sklearn==0.0` shim is also
# dropped in favour of the real `scikit-learn` it aliases.
dependencies = [
    # --- deep learning / graph stack (CUDA 11.3 / DGL CUDA 11.1, see [tool.uv.sources]) ---
    "torch==1.10.2",
    "torchvision==0.11.3",
    "torchaudio==0.10.2",
    "torch-geometric==2.0.3",
    "torch-scatter==2.0.9",
    "torch-sparse==0.6.12",
    "torch-cluster==1.5.9",
    "torch-spline-conv==1.2.1",
    "dgl-cu111==0.8.0",
