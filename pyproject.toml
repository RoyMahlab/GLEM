[tool.uv]
# The CUDA wheels (torch cu113, DGL cu111, PyG extensions) only exist for
# manylinux x86_64, which is also all the `ct` conda env ever targeted.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

# Old sdists (pathtools, promise, termcolor, nvidia-ml-py3, ...) predate PEP 517 and
# assume setuptools/wheel are importable in the build env.
[tool.uv.extra-build-dependencies]
pathtools = ["setuptools<58"]
promise = ["setuptools"]
termcolor = ["setuptools"]
nvidia-ml-py3 = ["setuptools"]
littleutils = ["setuptools"]
timeloop = ["setuptools"]
python-louvain = ["setuptools"]

[tool.uv.sources]
torch = { index = "pytorch-cu113" }
torchvision = { index = "pytorch-cu113" }
torchaudio = { index = "pytorch-cu113" }
torch-scatter = { index = "pyg-torch1.10.0-cu113" }
torch-sparse = { index = "pyg-torch1.10.0-cu113" }
torch-cluster = { index = "pyg-torch1.10.0-cu113" }
torch-spline-conv = { index = "pyg-torch1.10.0-cu113" }
dgl-cu111 = { index = "dgl" }

# `explicit = true` => only the packages routed here via [tool.uv.sources] are
# looked up on these indexes; everything else comes from PyPI.
[[tool.uv.index]]
name = "pytorch-cu113"
url = "https://download.pytorch.org/whl/cu113"
explicit = true

[[tool.uv.index]]
name = "pyg-torch1.10.0-cu113"
url = "https://data.pyg.org/whl/torch-1.10.0+cu113.html"
format = "flat"
explicit = true

[[tool.uv.index]]
name = "dgl"
url = "https://data.dgl.ai/wheels/repo.html"
format = "flat"
explicit = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# GLEM has no installable package (everything runs from `src/`); the only thing
# this project ships into the venv is sitecustomize.py, which preloads the CUDA 11
# shared libraries for DGL.
[tool.setuptools]
py-modules = ["sitecustomize"]
